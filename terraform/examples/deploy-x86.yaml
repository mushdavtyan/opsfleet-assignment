apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-x86
  labels:
    app: demo-x86
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-x86
  template:
    metadata:
      labels:
        app: demo-x86
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 0
      containers:
        - name: nginx
          image: public.ecr.aws/docker/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
